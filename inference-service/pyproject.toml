[project]
name = "foodmind-recommendation-inference"
version = "0.1.0"
description = "Private FoodMind recommendation model inference service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "numpy>=2.3.0,<3.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.10.0,<3.0",
    "uvicorn>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.12.0,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
