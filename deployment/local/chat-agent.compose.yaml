services:
  chat-agent:
    build:
      context: ../../agent-service/app/agents/chatbot
    read_only: true
    env_file:
      - path: ../../agent-service/app/agents/.env
        required: false
    ports:
      - "127.0.0.1:${CHAT_AGENT_PORT:-8001}:8001"
    environment:
      CHAT_AGENT_ENVIRONMENT: local
      CHAT_AGENT_INTERNAL_SERVICE_TOKEN: ${CHAT_AGENT_INTERNAL_SERVICE_TOKEN:?required}
      CHAT_AGENT_LLM_ENABLED: ${CHAT_AGENT_LLM_ENABLED:-false}
      CHAT_AGENT_LLM_BASE_URL: ${CHAT_AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      CHAT_AGENT_LLM_MODEL: ${CHAT_AGENT_LLM_MODEL:-deepseek-v4-pro}
      CHAT_AGENT_LLM_TEMPERATURE: ${CHAT_AGENT_LLM_TEMPERATURE:-1.3}
      CHAT_AGENT_LLM_THINKING_ENABLED: ${CHAT_AGENT_LLM_THINKING_ENABLED:-false}
      CHAT_AGENT_BACKEND_BASE_URL: ${CHAT_AGENT_BACKEND_BASE_URL:-http://host.docker.internal:8080}
      CHAT_AGENT_BACKEND_SERVICE_TOKEN: ${CHAT_AGENT_BACKEND_SERVICE_TOKEN:-local-development-service-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
