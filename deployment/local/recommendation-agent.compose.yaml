services:
  recommendation-agent:
    build:
      context: ../../agent-service/app/agents/recommendation
    read_only: true
    user: "10001:10001"
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      RECOMMENDATION_AGENT_APP_ENV: local
      RECOMMENDATION_AGENT_INTERNAL_SERVICE_TOKEN: ${RECOMMENDATION_AGENT_INTERNAL_SERVICE_TOKEN:?required}
      RECOMMENDATION_AGENT_INFERENCE_BASE_URL: http://contract-fake:9000
      RECOMMENDATION_AGENT_INFERENCE_SERVICE_TOKEN: ${RECOMMENDATION_AGENT_INFERENCE_SERVICE_TOKEN:?required}
    depends_on:
      contract-fake:
        condition: service_started
    networks: [recommendation-private]

  contract-fake:
    image: python:3.13-alpine
    read_only: true
    working_dir: /fixtures
    volumes:
      - ../../artifacts/test-fixtures/recommendation/agent-golden-v2/inference-response.json:/fixtures/response.json:ro
    command:
      - python
      - -c
      - |
        import http.server
        import pathlib
        body = pathlib.Path('/fixtures/response.json').read_bytes()
        class Handler(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == '/health/ready':
                    self.send_response(200)
                    self.end_headers()
                    return
                self.send_response(404)
                self.end_headers()
            def do_POST(self):
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def log_message(self, *_):
                pass
        http.server.ThreadingHTTPServer(('0.0.0.0', 9000), Handler).serve_forever()
    networks: [recommendation-private]

networks:
  recommendation-private:
    internal: true
