[project]
name = "recommendation-agent"
version = "0.1.0"
description = "Bounded private Recommendation Agent service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "httpx>=0.28.1,<1.0",
    "langgraph>=1.2.10,<2.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "uvicorn>=0.52.1,<1.0",
]

[project.scripts]
recommendation-agent = "recommendation_agent.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.164.0,<7.0",
    "httpx2>=2.9.1,<3.0",
    "jsonschema>=4.26.0,<5.0",
    "mypy>=2.3.0,<3.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.1,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "FURB", "PIE", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["recommendation_agent"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/recommendation_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
