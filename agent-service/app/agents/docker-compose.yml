services:
  recommendation:
    build: ./recommendation
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8004:8004"
    environment:
      RECOMMENDATION_AGENT_APP_ENV: local
      RECOMMENDATION_AGENT_INTERNAL_SERVICE_TOKEN: local-recommendation-token
      RECOMMENDATION_AGENT_LLM_ENABLED: "true"
      RECOMMENDATION_AGENT_INFERENCE_BASE_URL: http://inference:8002
      RECOMMENDATION_AGENT_INFERENCE_SERVICE_TOKEN: local-inference-only
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped

  inference:
    build: ../../../inference-service
    ports:
      - "8002:8002"
    environment:
      INFERENCE_APP_ENV: local
      INFERENCE_INTERNAL_SERVICE_TOKEN: local-inference-only
      INFERENCE_MODEL_PACKAGE_DIR: /model-package
    volumes:
      - ../../../../foodmind-ml/.tmp/runtime/model-package:/model-package:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  cooking:
    build: ./cooking
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8003:8003"
    environment:
      COOKING_PLAN_ENVIRONMENT: local
      COOKING_PLAN_INTERNAL_SERVICE_TOKEN: local-cooking-token
      COOKING_PLAN_SAFETY_POLICY_REGION: SG
      COOKING_PLAN_LLM_ENABLED: "true"
      COOKING_PLAN_LLM_BASE_URL: https://api.deepseek.com
      COOKING_PLAN_LLM_MODEL: deepseek-chat
      COOKING_PLAN_TASK_API_ENABLED: "true"
    restart: unless-stopped

  chatbot:
    build: ./chatbot
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8001:8001"
    environment:
      CHAT_AGENT_ENVIRONMENT: local
      CHAT_AGENT_INTERNAL_SERVICE_TOKEN: local-chat-token
      CHAT_AGENT_LLM_ENABLED: "true"
      CHAT_AGENT_LLM_BASE_URL: https://api.deepseek.com
      CHAT_AGENT_LLM_MODEL: deepseek-chat
      CHAT_AGENT_BACKEND_BASE_URL: ${CHAT_AGENT_BACKEND_BASE_URL:-http://host.docker.internal:8080}
      CHAT_AGENT_BACKEND_SERVICE_TOKEN: ${CHAT_AGENT_BACKEND_SERVICE_TOKEN:-local-development-service-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
