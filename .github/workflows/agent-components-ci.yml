name: Agent components CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-components-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      chatbot: ${{ steps.filter.outputs.chatbot }}
      cooking: ${{ steps.filter.outputs.cooking }}
      inference: ${{ steps.filter.outputs.inference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            echo "chatbot=true" >> "$GITHUB_OUTPUT"
            echo "cooking=true" >> "$GITHUB_OUTPUT"
            echo "inference=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root_change='^(\.github/workflows/agent-components-ci\.yml|scripts/check-secrets\.py)$'
          for component in chatbot cooking; do
            if grep -Eq "^agent-service/app/agents/$component/|$root_change" <<< "$changed_files"; then
              echo "$component=true" >> "$GITHUB_OUTPUT"
            else
              echo "$component=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if grep -Eq "^inference-service/|$root_change" <<< "$changed_files"; then
            echo "inference=true" >> "$GITHUB_OUTPUT"
          else
            echo "inference=false" >> "$GITHUB_OUTPUT"
          fi

  chatbot:
    needs: changes
    if: needs.changes.outputs.chatbot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-service/app/agents/chatbot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -W error

  cooking:
    needs: changes
    if: needs.changes.outputs.cooking == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-service/app/agents/cooking
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/unit tests/contract tests/security --cov=cooking_plan_agent --cov-report=xml:coverage.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cooking-tests-${{ github.sha }}
          path: agent-service/app/agents/cooking/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  inference:
    needs: changes
    if: needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: inference-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -W error

  security:
    needs: changes
    if: needs.changes.outputs.chatbot == 'true' || needs.changes.outputs.cooking == 'true' || needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          python3 scripts/check-secrets.py
          agent-service/app/agents/chatbot
          agent-service/app/agents/cooking
          inference-service

  agent-components-gate:
    name: Agent components gate
    if: always()
    needs: [changes, chatbot, cooking, inference, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every affected component gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.chatbot }}" == true ]]; then test "${{ needs.chatbot.result }}" = success; else test "${{ needs.chatbot.result }}" = skipped; fi
          if [[ "${{ needs.changes.outputs.cooking }}" == true ]]; then test "${{ needs.cooking.result }}" = success; else test "${{ needs.cooking.result }}" = skipped; fi
          if [[ "${{ needs.changes.outputs.inference }}" == true ]]; then test "${{ needs.inference.result }}" = success; else test "${{ needs.inference.result }}" = skipped; fi
          if [[ "${{ needs.changes.outputs.chatbot }}" == true || "${{ needs.changes.outputs.cooking }}" == true || "${{ needs.changes.outputs.inference }}" == true ]]; then test "${{ needs.security.result }}" = success; else test "${{ needs.security.result }}" = skipped; fi
